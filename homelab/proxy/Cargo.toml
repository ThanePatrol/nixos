[package]
name = "rev-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["blocking"] }
async-trait="0.1"
bytes = "1.11.1"
http = "1.4.2"
once_cell = "1.21.4"
openidconnect = { version = "4", features = ["reqwest"] }
pingora = { version = "0.8", default-features = false, features = [ "lb", "boringssl", "proxy"] }
prometheus = "0.14.0"
serde = "1.0.228"
serde_json = "1.0.150"
tokio = "1.52.3"
url = "2"
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
